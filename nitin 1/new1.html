<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E‑Commerce Website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f5f5f5; }

    header {
      background: #1e293b;
      color: #fff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 24px; }

    nav a {
      color: #fff;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 15px;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 6px;
    }

    .card h3 { margin: 10px 0; }
    .price { color: green; font-weight: bold; }

    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover { background: #1d4ed8; }

    footer {
      background: #1e293b;
      color: #fff;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header>
  <h1>MyShop</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Cart</a>
    <a href="#">Login</a>
  </nav>
</header>

<div class="container">
  <h2>Featured Products</h2><br>
  <div class="products">

    <div class="card">
      <img src="https://via.placeholder.com/300" alt="Product">
      <h3>Product One</h3>
      <p class="price">₹999</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300" alt="Product">
      <h3>Product Two</h3>
      <p class="price">₹1499</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300" alt="Product">
      <h3>Product Three</h3>
      <p class="price">₹1999</p>
      <button>Add to Cart</button>
    </div>

  </div>
</div>

<footer>
  <p>© 2026 MyShop. All rights reserved.</p>
</footer>

</body>
<script>
    const buttons = document.querySelectorAll('button');
    buttons.forEach(button => {
        button.addEventListener('click', () => {
        alert('Item added to cart!');
        });
    });
     
</script>
</html>
