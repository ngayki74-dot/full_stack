<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <style>body{background-color: rgb(118, 155, 113);}
#box{width: 300px;margin: auto;margin-top: 50px;box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;padding: 20px;background-color: aqua;border-radius: 30px;}
    </style>
</head>
<body>
    <h1 style="text-align: center;color: blue; text-shadow: 1px 1px 2px pink;font-size: 80px;">login</h1>
    <div id="box">
        <table>
            <tr>
                <td><label for="username">Username:</label></td>
                <td><input type="text" id="username" name="username"></td>
             </tr>
        </table>
        <br>
        <table>
            <tr>
                <td><label for="password">Password:</label></td>
                <td><input type="password" id="password" name="password"></td>
             </tr>
        </table>
        <br>
        <button style="background-color: blue; color: white;padding: 10px 20px;border-radius: 30px;border: 0;margin-left: 80px;">Login</button>
        <button style="background-color: blue;color: white;padding: 10px 20px;border-radius: 30px;margin-left: 30px;border: 0;">Sign in</button>
    

    </div>
    
</body>
</html>
