<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>media probiem 1</title> 
     <style>
        #box1{
            height: 100px;background-color: aqua;
        } 
        h1{margin-left: 80px;color: blue;padding: 20px;;}
        #box2{
            height: 500px;margin-top: 30px;display: flex;justify-content: space-between;
        }
        #box3{
            width: 60%;background-color: brown;
        }
        #box4{
            width: 35%;display: grid;gap: 40px;
        } 
        #box4 div{ 
            background-color: blue;font-size: larger;
        }
        @media all and (min-width:481px) and (max-width:769px) {
            #box2{
                display: block;
            }
            #box3{
                width: 100%;height: 380px;
            }
            #box4{
                grid-template-columns: repeat(3,1fr);
                width: 100%;
                height: 100px;
                margin-top: 20px;
            }
        }
        @media all and (min-width:320px) and (max-width:480px) {
            #box2{
                display: block;
            }
            #box3{
                width: 100%;height: 375px;
            }
            #box4{
                grid-template-columns: repeat(1,1fr);
                width: 100%;gap: 10px;margin-top: 20px;
        
                
            }
        }
     </style>
</head>
<body>
    <div id="box1">
        <h1>Skillonit</h1>
    </div> 
    <div id="box2">
        <div id="box3"></div>
        <div id="box4">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </div>
</body>
</html>
