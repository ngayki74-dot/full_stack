<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create Element</title>
</head>
<body>
    <div id="main"></div>

</body>
<script>
    let main =document.getElementById("main")     //HTML मधला <div id="main"></div> मिळतो
    let h1 =document.createElement("h1")    //नवीन <h1>hello</h1> तयार होतो
    h1.innerText="hello"
   // main.append(h1)              //main div मध्ये h1 add होतात

    let para =document.createElement("p")     //नवीन <p>how are you amol</p> तयार होतो
    para.innerText="how are you amol"            
   // main.append(para)            // main div मध्ये  p add होतात
   main.append(h1,para)                //main div मध्ये h1 आणि p add होतात
</script>
</html>



<!-- खूप छान! 👏 हा कोड 100% बरोबर आहे. तुम्ही createElement() आणि append() योग्य प्रकारे वापरले आहेत.

चला Step by Step समजून घेऊ.

HTML
<div id="main"></div>

सुरुवातीला div रिकामा आहे.

Step 1 : main Element मिळवणे
let main = document.getElementById("main");

id="main" असलेला <div> मिळतो.

Step 2 : नवीन <h1> तयार करणे
let h1 = document.createElement("h1");

Memory मध्ये नवीन <h1> तयार होतो.

अजून तो Web Page वर दिसत नाही.

Step 3 : <h1> मध्ये Text टाकणे
h1.innerText = "hello";

आता तो असा झाला.

<h1>hello</h1>
Step 4 : नवीन <p> तयार करणे
let para = document.createElement("p");

Memory मध्ये नवीन Paragraph तयार होतो.

Step 5 : Paragraph मध्ये Text टाकणे
para.innerText = "how are you amol";

आता तो असा झाला.

<p>how are you amol</p>
Step 6 : append()
main.append(h1, para);

दोन्ही elements main मध्ये add होतात.

Final HTML

Browser मध्ये प्रत्यक्षात हे तयार होते.

<div id="main">
    <h1>hello</h1>
    <p>how are you amol</p>
</div>
Output
hello

how are you amol
append() चे फायदे

एकावेळी अनेक elements add करता येतात.

main.append(h1, para);

किंवा

main.append(h1);
main.append(para);

दोन्ही योग्य आहेत.

Execution Flow
Page Load
     │
     ▼
main मिळाला
     │
     ▼
<h1> तयार झाला
     │
     ▼
Text दिला
     │
     ▼
<p> तयार झाला
     │
     ▼
Text दिला
     │
     ▼
append()
     │
     ▼
Page वर दिसले
append() vs appendChild()
append()	appendChild()
एकावेळी अनेक elements add करू शकतो	फक्त एक element add करतो
Text देखील add करू शकतो	फक्त Node add करतो
आधुनिक (Modern) Method	जुनी (Older) Method

उदाहरण:

main.append(h1, para, "Welcome");

हे चालते.

पण

main.appendChild("Welcome");

हे चालत नाही.

आणखी एक Example
let img = document.createElement("img");

img.src = "https://via.placeholder.com/150";
img.alt = "Sample Image";

main.append(img);

यामुळे Page वर Image दिसेल.
