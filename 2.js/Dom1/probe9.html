आणखी चांगला Code

रिकामे Input तपासा.

function Login() {

    if (inputUsername.value === "" || inputPassword.value === "") {

        result.innerText = "Please fill all fields";
        result.style.color = "orange";
        return;
    }

    if (
        inputUsername.value === username &&
        inputPassword.value === password
    ) {

        result.innerText = "Login Successful";
        result.style.color = "green";

    } else if (inputUsername.value !== username) {

        result.innerText = "Wrong Username";
        result.style.color = "red";

    } else {

        result.innerText = "Wrong Password";
        result.style.color = "red";

    }

}

Interview Questions
=== आणि !== म्हणजे काय?
Operator	Meaning
===	Value आणि Data Type दोन्ही समान आहेत का?
!==	Value किंवा Data Type वेगळे आहेत का?

उदाहरण:

5 === 5      // true
5 === "5"    // false
5 !== "5"    // true
