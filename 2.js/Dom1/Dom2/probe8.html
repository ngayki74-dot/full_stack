<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event</title>
</head>
<body>
    <h1>Event</h1>
    <h2>I am Heading 2</h2>
    <button>Click</button>
</body>

<script>
    let head = document.querySelector("h1");
    let head2 = document.querySelector("h2");
    let btn = document.querySelector("button");

    // Button click event
    btn.addEventListener("click", function abc() {
        alert("Clicked me");
    });

    // Mouse over event on h1
    head.addEventListener("mouseover", function() {
        head.style.color = "red";
    });
    //mouseout event on h2
      head2.addEventListener("mouseout", function() {
        head2.style.color = "blue";
    })
</script>
</html>

आणखी छान बनवू शकता

जर Mouse बाहेर गेल्यावर पुन्हा काळा रंग करायचा असेल:

head.addEventListener("mouseover", function () {
    head.style.color = "red";
});

head.addEventListener("mouseout", function () {
    head.style.color = "black";
});

जर h2 वर Mouse आला की Green करायचा असेल:

head2.addEventListener("mouseover", function () {
    head2.style.color = "green";
});

head2.addEventListener("mouseout", function () {
    head2.style.color = "blue";
});
काही Common Events
Event	कधी चालतो?
click	Click केल्यावर
dblclick	Double Click केल्यावर
mouseover	Mouse वर आल्यावर
mouseout	Mouse बाहेर गेल्यावर
mousemove	Mouse हलवल्यावर
keydown	Keyboard Key दाबल्यावर
keyup	Key सोडल्यानंतर
input	Input मध्ये typing करताना
change	Input value बदलल्यावर
submit	Form Submit झाल्यावर
📝 छोटी सूचना

या ठिकाणी:

btn.addEventListener("click", function abc() {
    alert("Clicked me");
});

abc हे function नाव आवश्यक नाही. तुम्ही anonymous function वापरू शकता:

btn.addEventListener("click", function () {
    alert("Clicked me");
});

किंवा arrow function:

btn.addEventListener("click", () => {
    alert("Clicked me");
});

ही दोन्ही आधुनिक JavaScript मध्ये खूप वापरली जातात.

🎯 Practice Challenge

हे करून पाहा:

Double Click केल्यावर <h1> चा text "Double Clicked!" करा.
Mouseover वर <h2> चा background yellow करा.
Mouseout झाल्यावर background पुन्हा white करा.
Button वर Click केल्यावर page चा background lightblue करा.
