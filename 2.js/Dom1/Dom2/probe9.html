<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>event 2</title>
</head>
<body>
     <h1 id="head"></h1> <!-- 👉 हा <h1> tag आहे. यामध्ये click केल्यावर कोणत्या element ने click केले ते text दिसेल-->
     <button>click</button>  <!--👉 हा button आहे. यावर click केल्यावर event trigger होईल -->
     <p>i am para</p>  <!-- 👉 हा paragraph आहे. यावर click केल्यावर पण event trigger होईल --> 
</body>

<script>
    let btn = document.querySelector("button");   //HTML मधील button element घेण्यासाठी. btn या variable मध्ये store केले
    let head = document.getElementById("head");   //id="head" असलेला <h1> element घेतला
    let para = document.querySelector("p");         //HTML मधील paragraph (<p>) element घेतला

    btn.addEventListener("click", abc);      //button वर click event लावला.click झाला की abc() function call होईल
    para.addEventListener("click", efg);   //paragraph वर click event .click झाला की efg() function call होईल

    function abc(event) {
        let x = event.target;  //event.target म्हणजे नेमकं कोणत्या element वर click झाला.  button click केल्यावर x = <button>
        head.innerText = "Clicked by " + x.tagName;    //<h1> मध्ये text टाकतो x.tagName → BUTTON
        
    }

    function efg(event) {              
        let x = event.target;         //paragraph click केल्यावर x.tagName → P <h1> मध्ये Clicked by P दिसेल
        head.innerText = "Clicked by " + x.tagName;       //Paragraph क्लिक केला → Clicked by P
    }
</script>
</html>



<!-- खूप छान! 👏 हा कोड 100% बरोबर आहे. विशेष म्हणजे तुम्ही event.target वापरला आहे, जो DOM Events मधील महत्त्वाचा concept आहे.

सध्या दोन functions आहेत:

दोन्ही जवळजवळ सारखेच आहेत.

एकच function वापरता येईल.

function showTag(event) {
    head.innerText = "Clicked by " + event.target.tagName;
}

btn.addEventListener("click", showTag);
para.addEventListener("click", showTag);

यामुळे code कमी होतो आणि maintain करणे सोपे जाते.

event.target चे इतर उपयोग
event.target.innerText
Click
event.target.style.color = "red";

ज्यावर click केला त्याचा text लाल होईल.

event.target.style.backgroundColor = "yellow";

ज्यावर click केला त्याचा background पिवळा होईल.

Event Object मधील काही Properties
Property	उपयोग
event.target	Click झालेला element
event.target.tagName	Element चे नाव (BUTTON, P)
event.target.innerText	त्या element मधील text
event.type	Event चा प्रकार (click)

उदाहरण:

function showInfo(event) {
    console.log(event.type);           // click
    console.log(event.target.tagName); // BUTTON किंवा P
    console.log(event.target.innerText); // Click किंवा i am para
}
