<!-- id,class, tag
  | प्रकार | वापर                           | किती वेळा |
| ------ | --------------------------     | --------- |
| id     | एक element ओळखायला           | एकदाच     |
| class  | अनेक elements group करायला     | अनेकदा    |
| tag    | element चा type                | सगळीकडे   |

// id
document.querySelector("#mainHeading");

// class
document.querySelectorAll(".heading");

// tag
document.querySelectorAll("p");

लक्षात ठेवा

# → id साठी

. → class साठी

काहीच नाही → tag साठी
प्रकार	Method
id	getElementById()
class	getElementsByClassName()
tag	getElementsByTagName()
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Id,Class,Tag</title>
</head>
<body>
    <p class="csk" id="Dhoni">I am Dhoni from Chennai</p>
    <p class="mi">I am Sachi from Mumbai</p>
    <p class="rcb">I am Varat from Benglore</p>
    <p class="mi">I am Rohit from Mumbai</p>
    <p class="rcb" id="abd"> I am ABD from Bengalore</p>
    <p class="csk">I am Raina from Chennai</p>
</body>
<script>
   let csk=document.getElementsByClassName("csk")
   console.log(csk)    //csk class असलेले सगळे <p> elements घेतो  csk मध्ये येते:
    //0: <p class="csk" id="Dhoni">I am Dhoni from Chennai</p>
    //1: <p class="csk">I am Raina from Chennai</p>
    //पहिला csk player:    console.log(csk[0].innerText);
    //दुसरा csk player:     console.log(csk[1].innerText);
    //Loop वापरून सगळे CSK players print करायला
    //for (let i = 0; i < csk.length; i++) {console.log(csk[i].innerText);}


    //id Element
    let Dhoni = document.getElementById("Dhoni");                  // CSS	JavaScript
        Dhoni.style.backgroundColor="yellow"        //background → पिवळा 🟨   //background-color	backgroundColor
        Dhoni.style.color="red"                   //text color → लाल 🔴        //font-style	fontStyle
        Dhoni.style.fontSize ="40px"                //text size → 40px (मोठा होतो) //font-size	fontSize

        let rcb =document.getElementsByClassName("rcb")
        rcb[0].style.backgroundColor="red"  //rcb class असलेले २ paragraphs घेतो   //rcb[0]  पहिला → लाल 🔴
        rcb[1].style.backgroundColor="blue"   //rcb[1]दुसरा RCB player → ABD      //rcb[1]   दुसरा → निळा 🔵

                     //Loop वापरून दोघांनाही same color द्यायचा असेल तर
                   for (let i = 0; i < rcb.length; i++) {
                          rcb[i].style.backgroundColor = "red";}  //लाल 🔴
</script>

</html>



<!-- तुमचा कोड बरोबर आहे आणि DOM शिकण्यासाठी चांगले उदाहरण आहे. फक्त काही लहान सुधारणा आणि स्पष्टीकरण देतो.

1. id, class, tag मधील फरक
प्रकार	वापर	किती वेळा
id	एक element ओळखण्यासाठी	फक्त एकदाच
class	अनेक elements ला group करण्यासाठी	अनेकदा
tag	Element चा प्रकार (p, h1, div...)	सगळीकडे
2. JavaScript Methods
ID
let dhoni = document.getElementById("Dhoni");

फक्त एक element मिळतो.

Class
let csk = document.getElementsByClassName("csk");

HTMLCollection मिळते.

Tag
let p = document.getElementsByTagName("p");

सर्व <p> elements मिळतात.

3. querySelector() आणि querySelectorAll()
ID
document.querySelector("#Dhoni");

# म्हणजे id.

Class
document.querySelectorAll(".csk");

. म्हणजे class.

Tag
document.querySelectorAll("p");

काहीच नाही म्हणजे tag.

4. तुमचा Style Code
let Dhoni = document.getElementById("Dhoni");

Dhoni.style.backgroundColor = "yellow";
Dhoni.style.color = "red";
Dhoni.style.fontSize = "40px";

यामुळे Dhoni paragraph असा दिसेल:

🟨 Yellow Background
🔴 Red Text
🔠 Font Size = 40px
5. RCB Example
let rcb = document.getElementsByClassName("rcb");

rcb[0].style.backgroundColor = "red";
rcb[1].style.backgroundColor = "blue";

Output

Player	Background
Virat	🔴 Red
ABD	🔵 Blue
6. Loop
for (let i = 0; i < rcb.length; i++) {
    rcb[i].style.backgroundColor = "red";
}

हे loop नंतर दोघांचाही background लाल होईल.

म्हणजे आधी दिलेला

rcb[1].style.backgroundColor = "blue";

हा color loop मुळे overwrite होईल.

अंतिम Output

Player	Background
Virat	🔴 Red
ABD	🔴 Red
7. CSS Property → JavaScript Property
CSS	JavaScript
background-color	backgroundColor
font-size	fontSize
font-style	fontStyle
text-align	textAlign
border-radius	borderRadius
margin-top	marginTop
padding-left	paddingLeft
8. आणखी सोपा Loop
let csk = document.getElementsByClassName("csk");

for (let i = 0; i < csk.length; i++) {
    console.log(csk[i].innerText);
}

Output:

I am Dhoni from Chennai
I am Raina from Chennai
⭐ एक छोटी सूचना

JavaScript मध्ये variable names सामान्यतः camelCase मध्ये लिहितात. त्यामुळे:

let dhoni = document.getElementById("Dhoni");

हे

let Dhoni = document.getElementById("Dhoni");

पेक्षा अधिक प्रचलित आहे. यामुळे code अधिक readable आणि standard राहतो.
