<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Check</title>
</head>
<body>

    <input type="text" id="username" placeholder="Enter username">
    <input type="password" id="password" placeholder="Enter password">
    <button onclick="login()">Login</button>

    <h2 id="result"></h2>

    <script>
        let correctUsername = "rahul@123";
        let correctPassword = "123456";

        let inputUsername = document.getElementById("username");
        let inputPassword = document.getElementById("password");
        let result = document.getElementById("result");

        function login() {

            if (
                inputUsername.value === correctUsername &&
                inputPassword.value === correctPassword
            ) {
                result.innerText = "Login Successful ";
                result.style.color = "green";
            }
            else if (inputUsername.value !== correctUsername) {
                result.innerText = "Username wrong ";
                result.style.color = "red";
            }
            else if (inputPassword.value !== correctPassword) {
                result.innerText = "Password wrong ";
                result.style.color = "red";
            }
        }
    </script>

</body>
</html>

आणखी चांगली Version (Validation)

जर User ने काहीही टाइप केले नाही तर:

function login() {

    if (inputUsername.value === "" || inputPassword.value === "") {
        result.innerText = "Please enter username and password";
        result.style.color = "orange";
        return;
    }

    if (
        inputUsername.value === correctUsername &&
        inputPassword.value === correctPassword
    ) {
        result.innerText = "Login Successful";
        result.style.color = "green";
    } else if (inputUsername.value !== correctUsername) {
        result.innerText = "Username wrong";
        result.style.color = "red";
    } else {
        result.innerText = "Password wrong";
        result.style.color = "red";
    }
}
Interview Questions
1. === म्हणजे काय?

Strict Equality Operator.

5 === 5      // true
5 === "5"    // false
2. && म्हणजे काय?

Logical AND Operator.

true && true     // true
true && false    // false

दोन्ही conditions true असल्या तरच true मिळते.

3. .value कशासाठी वापरतात?

Input Field मधील value मिळवण्यासाठी.

inputUsername.value
