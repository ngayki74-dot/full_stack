//Input box वापरून Heading change करणे
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Input Example</title>
</head>
<body>

    <h1 id="heading">Skillonit</h1>

    <input type="text" id="myInput" placeholder="username">
    <button onclick="changeHeading()">Submit</button>

    <script>
        function changeHeading() {
            let inputValue = document.getElementById("myInput").value;
            document.getElementById("heading").innerText = inputValue;
        }
      //  input.value कसे घ्यायचे                 //User input वापरून text बदलणे
    </script>

</body>
</html>

आणखी चांगले Example

Input रिकामा असेल तर message दाखवा.

function changeHeading() {

    let inputValue = document.getElementById("myInput").value;

    if (inputValue === "") {
        alert("Please enter your name");
    } else {
        document.getElementById("heading").innerText = inputValue;
    }

}
Input साफ करायचा असेल

Button click झाल्यावर Input रिकामा करा.

function changeHeading() {

    let input = document.getElementById("myInput");

    document.getElementById("heading").innerText = input.value;

    input.value = "";
}
Interview Questions
Q1. .value म्हणजे काय?

Answer:
.value ही HTML Input Element ची Property आहे. ती Input मधील value मिळवण्यासाठी किंवा बदलण्यासाठी वापरली जाते.

Q2. innerText आणि .value मध्ये फरक?
innerText	.value
<h1>, <p>, <div> सारख्या elements चा text मिळवतो/बदलतो	<input>, <textarea>, <select> मधील value मिळवतो/बदलतो
Visible text साठी वापरतो	User ने टाइप केलेला data साठी वापरतो
लक्षात ठेवण्याचा सोपा नियम
innerText → Display होणारा Text
innerHTML → HTML + Text
textContent → पूर्ण Text (Hidden सहित)
.value → Input Box मधील Value

ही चार properties (innerText, innerHTML, textContent, .value) DOM शिकताना सर्वात जास्त वापरल्या जातात. -->
