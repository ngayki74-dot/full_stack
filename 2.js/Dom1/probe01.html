<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Dom</h1>
    <button onclick="abc ()">click me</button>
    <p onclick="hello()">hello</p>

</body>
<script>
    function abc() {
        console.log("hello")
    }
    function hello() {
     console.log("how are you ?")
    }
</script>
</html>
