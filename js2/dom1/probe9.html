<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>probe9</title>
</head>
<body>
    <input type="text" placeholder="enter your username" id="username">
    <input type="text" placeholder="enter your pasword" id="password">
    <button onclick="Login()">Login</button>

    <h2 id="result"></h2>
</body>
 <script>
    let username = "skillonit@123"
    let password = "123456"

    let inputUsername = document.getElementById("username")
    let inputPassword = document.getElementById("password")
    let result = document.getElementById("result")

     function Login(){
         if(inputUsername.value === username && 
            inputPassword.value === password
         ){
             result.innerText = "Login successful";
             result.style.color = "green";
         }
         else if(inputUsername.value !== username){
             result.innerText ="wrong username";
             result.style.color = "red";
         }
         else if(inputPassword.value !== password){
             result.innerText = "wrong password";
             result.style.color = "red"
         }
    }
</script> 

</html>
