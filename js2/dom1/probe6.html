<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Counter App</title>
    <style>
        body {
            text-align: center;
            margin-top: 100px;
            font-family: Arial;
        }
        h1 {
            font-size: 50px;
        }
        button {
            font-size: 20px;
            padding: 10px 20px;
            margin: 10px;
        }
    </style>
</head>
<body>

    <h1 id="count">0</h1>

    <button onclick="decrease()">-</button>
    <button onclick="increase()">+</button>
    <button onclick="reset()">Reset</button>

    <script>
        let count = 0;
        let countElement = document.getElementById("count");

        function increase() {
            count++;
            countElement.innerText = count;
        }

        function decrease() {
            count--;
            countElement.innerText = count;
        }

        function reset() {
            count = 0;
            countElement.innerText = count;
        }
        //count → number store करतो              //innerText → screen वर number दाखवतो

    //Button click → function call              //JavaScript logic → value change
    </script>

    

</body>
</html>
