<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>h1 5 five time in div</title>
</head>
<body>
    <div id="main"></div>

</body>
<script>
    let main = document.getElementById("main");
    
    for(let i=0;i<=5;i++){
        let h1=document.createElement("h1");
        h1.innerText="Hello, hou are you";
        main.append(h1);
    }
</script>
</html>
